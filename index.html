<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODAY — Warped Zine To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Courier+Prime&display=swap" rel="stylesheet">
<script src="linear-data.js"></script>
<style>
  :root {
    --bg: #f2ede1;
    --ink: #0a0a0a;
    --accent: #e8402c;
    --accent2: #2c6ee8;
    --paper: #fffdf6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier Prime', monospace;
    min-height: 100vh;
    padding: 32px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* halftone overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, rgba(10,10,10,0.06) 1px, transparent 1px);
    background-size: 6px 6px;
    z-index: 1;
    opacity: 0.5;
  }

  .wrap { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; }

  header {
    margin-bottom: 40px;
    text-align: center;
  }

  h1.warp {
    font-family: 'Fraunces', serif;
    font-size: clamp(48px, 11vw, 120px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
    animation: warp 6s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes warp {
    0%, 100% { font-variation-settings: 'opsz' 40, 'wght' 700; transform: scaleY(1); }
    50% { font-variation-settings: 'opsz' 140, 'wght' 900; transform: scaleY(1.08); }
  }

  .date-sub {
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
    color: #555;
  }

  .add-row {
    display: flex;
    gap: 10px;
    margin: 0 auto 48px;
    max-width: 560px;
    transform: rotate(-0.6deg);
  }

  .add-row input[type="text"] {
    flex: 1;
    font-family: 'Courier Prime', monospace;
    font-size: 15px;
    padding: 12px 14px;
    border: 2px solid var(--ink);
    background: var(--paper);
    outline: none;
  }

  .add-row select {
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    border: 2px solid var(--ink);
    background: var(--paper);
    padding: 0 8px;
  }

  .add-row button {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 15px;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 0 20px;
    cursor: pointer;
  }
  .add-row button:hover { background: var(--accent); border-color: var(--accent); }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: 0 auto 18px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #555;
  }
  .board-header button {
    font-family: 'Courier Prime', monospace;
    text-transform: lowercase;
    letter-spacing: normal;
    background: none;
    border: 1px solid var(--ink);
    padding: 5px 12px;
    cursor: pointer;
  }
  .board-header button:hover { background: var(--ink); color: var(--paper); }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
    align-items: start;
  }

  .card {
    background: var(--paper);
    border: 2px solid var(--ink);
    padding: 18px 16px 22px;
    position: relative;
    box-shadow: 5px 5px 0 var(--ink);
    clip-path: polygon(1% 0%, 98% 2%, 100% 96%, 3% 100%);
  }

  .card:nth-child(3n) { --base-rot: -2.2deg; }
  .card:nth-child(3n+1) { --base-rot: 1.6deg; }
  .card:nth-child(3n+2) { --base-rot: -0.8deg; }

  .card {
    --base-rot: 0deg;
    transform: rotate(var(--base-rot));
    transition: transform 0.15s ease;
    cursor: grab;
  }
  .card:hover { animation: wobble 0.4s ease; }
  .card.dragging { opacity: 0.4; cursor: grabbing; }
  .card.drag-over { outline: 2px dashed var(--accent); outline-offset: 4px; }

  @keyframes wobble {
    0%, 100% { transform: rotate(var(--base-rot)); }
    25% { transform: rotate(calc(var(--base-rot) - 2deg)); }
    75% { transform: rotate(calc(var(--base-rot) + 2deg)); }
  }

  .card .task-text {
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    padding-right: 46px;
  }

  .card.done .task-text {
    text-decoration: line-through wavy var(--accent);
    opacity: 0.5;
    transform: rotate(1deg);
  }

  .priority-tag {
    position: absolute;
    top: 6px;
    right: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 9px;
    color: var(--paper);
    background: var(--accent);
    transform: rotate(8deg);
    clip-path: polygon(6% 0, 100% 10%, 94% 100%, 0 90%);
  }
  .priority-tag.med { background: var(--accent2); }
  .priority-tag.low { background: #555; }

  .card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    font-size: 11px;
  }

  .card-actions button {
    font-family: 'Courier Prime', monospace;
    background: none;
    border: 1px solid var(--ink);
    padding: 4px 10px;
    cursor: pointer;
  }
  .card-actions button:hover { background: var(--ink); color: var(--paper); }

  .linear-section {
    margin-top: 56px;
  }

  .linear-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    max-width: 900px;
    margin: 0 auto 18px;
  }

  .linear-header h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0;
    transform: rotate(-1deg);
  }

  .linear-header .stamp {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border: 1px solid var(--ink);
    padding: 2px 8px;
    transform: rotate(2deg);
    color: #555;
  }

  .linear-card {
    background: #eee6d6;
    border: 2px dashed var(--ink);
    padding: 14px 16px;
    text-decoration: none;
    color: var(--ink);
    display: block;
  }

  .linear-card:hover { background: #e4dabf; }

  .linear-card .lc-id {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: #555;
  }

  .linear-card .lc-title {
    font-size: 14px;
    margin: 4px 0 8px;
    line-height: 1.4;
  }

  .linear-card .lc-due {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .linear-card .lc-due.overdue { color: var(--accent); font-weight: bold; }

  .empty-state {
    text-align: center;
    font-size: 14px;
    color: #777;
    grid-column: 1 / -1;
    padding: 40px 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="warp">TODAY</h1>
      <div class="date-sub" id="dateSub"></div>
    </header>

    <form class="add-row" id="addForm">
      <input type="text" id="taskInput" placeholder="what needs doing..." autocomplete="off" required>
      <input type="time" id="dueInput" title="due time (optional)">
      <select id="priorityInput">
        <option value="high">high</option>
        <option value="med" selected>med</option>
        <option value="low">low</option>
      </select>
      <button type="submit">ADD</button>
    </form>

    <div class="board-header">
      <span id="taskCount"></span>
      <button id="clearDoneBtn" type="button">clear completed</button>
    </div>

    <div class="board" id="board"></div>

    <div class="linear-section">
      <div class="linear-header">
        <h2>From Linear</h2>
        <span class="stamp">read-only</span>
      </div>
      <div class="board" id="linearBoard"></div>
    </div>
  </div>

<script>
  const board = document.getElementById('board');
  const form = document.getElementById('addForm');
  const input = document.getElementById('taskInput');
  const prioritySelect = document.getElementById('priorityInput');
  const taskCount = document.getElementById('taskCount');
  const clearDoneBtn = document.getElementById('clearDoneBtn');
  const STORAGE_KEY = 'warpedZineTasks';
  let dragId = null;

  document.getElementById('dateSub').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  function loadTasks() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveTasks(tasks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    const tasks = loadTasks();
    board.innerHTML = '';

    const openCount = tasks.filter(t => !t.done).length;
    taskCount.textContent = tasks.length
      ? `${openCount} open · ${tasks.length - openCount} done`
      : '';

    if (tasks.length === 0) {
      board.innerHTML = '<div class="empty-state">nothing pinned yet — add something above</div>';
      return;
    }

    tasks.forEach(task => {
      const card = document.createElement('div');
      card.className = 'card' + (task.done ? ' done' : '');
      card.draggable = true;
      card.dataset.id = task.id;

      const tag = document.createElement('div');
      tag.className = 'priority-tag ' + task.priority;
      tag.textContent = task.priority;

      const text = document.createElement('div');
      text.className = 'task-text';
      text.textContent = task.text;

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      const doneBtn = document.createElement('button');
      doneBtn.textContent = task.done ? 'undo' : 'done';
      doneBtn.onclick = () => toggleDone(task.id);

      const delBtn = document.createElement('button');
      delBtn.textContent = 'delete';
      delBtn.onclick = () => deleteTask(task.id);

      actions.appendChild(doneBtn);
      actions.appendChild(delBtn);

      card.appendChild(tag);
      card.appendChild(text);
      card.appendChild(actions);

      card.addEventListener('dragstart', () => {
        dragId = task.id;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', e => {
        e.preventDefault();
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', e => {
        e.preventDefault();
        card.classList.remove('drag-over');
        reorderTasks(dragId, task.id);
      });

      board.appendChild(card);
    });
  }

  function addTask(text, priority) {
    const tasks = loadTasks();
    tasks.unshift({ id: Date.now(), text, priority, done: false });
    saveTasks(tasks);
    render();
  }

  function toggleDone(id) {
    const tasks = loadTasks().map(t => t.id === id ? { ...t, done: !t.done } : t);
    saveTasks(tasks);
    render();
  }

  function deleteTask(id) {
    const tasks = loadTasks().filter(t => t.id !== id);
    saveTasks(tasks);
    render();
  }

  function reorderTasks(draggedId, targetId) {
    if (draggedId === targetId) return;
    const tasks = loadTasks();
    const fromIndex = tasks.findIndex(t => t.id === draggedId);
    const toIndex = tasks.findIndex(t => t.id === targetId);
    if (fromIndex === -1 || toIndex === -1) return;
    const [moved] = tasks.splice(fromIndex, 1);
    tasks.splice(toIndex, 0, moved);
    saveTasks(tasks);
    render();
  }

  function clearCompleted() {
    const tasks = loadTasks().filter(t => !t.done);
    saveTasks(tasks);
    render();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;
    addTask(val, prioritySelect.value);
    input.value = '';
  });

  clearDoneBtn.addEventListener('click', clearCompleted);

  function renderLinear() {
    const linearBoard = document.getElementById('linearBoard');
    const data = window.LINEAR_DATA;
    if (!data || !data.issues || data.issues.length === 0) {
      linearBoard.innerHTML = '<div class="empty-state">no active Linear tickets synced</div>';
      return;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const priorityWeight = { high: 3, med: 2, low: 1 };

    const ranked = [...data.issues].sort((a, b) => {
      const overdueA = a.dueDate ? Math.max(0, (today - new Date(a.dueDate)) / 86400000) : 0;
      const overdueB = b.dueDate ? Math.max(0, (today - new Date(b.dueDate)) / 86400000) : 0;
      const scoreA = overdueA * 3 + priorityWeight[a.priority];
      const scoreB = overdueB * 3 + priorityWeight[b.priority];
      return scoreB - scoreA;
    });

    linearBoard.innerHTML = '';
    ranked.forEach(issue => {
      const a = document.createElement('a');
      a.href = issue.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'linear-card';

      const isOverdue = issue.dueDate && new Date(issue.dueDate) < today;
      const dueLabel = issue.dueDate
        ? (isOverdue ? `overdue since ${issue.dueDate}` : `due ${issue.dueDate}`)
        : 'no due date';

      a.innerHTML = `
        <div class="lc-id">${issue.id} · ${issue.priority}</div>
        <div class="lc-title">${issue.title}</div>
        <div class="lc-due${isOverdue ? ' overdue' : ''}">${dueLabel}</div>
      `;
      linearBoard.appendChild(a);
    });
  }

  render();
  renderLinear();
</script>
</body>
</html>
